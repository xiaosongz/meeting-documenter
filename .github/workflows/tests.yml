name: Tests
on:
  push:
    branches: [main, 'codex/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc
          # Light voiceprint deps only: no torch, sherpa-onnx or model downloads in CI.
          # Model-dependent voiceprint tests skip cleanly without them.
          python -m pip install google-genai requests numpy scipy pyyaml pytest
          # Benchmark scoring only; bench tests use synthetic RTTMs, no dataset downloads.
          python -m pip install -r bench/requirements.txt
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh .githooks/pre-commit; do bash -n "$script"; done
      - name: Scan for PII and private files
        run: python scripts/dev/check_pii.py --tracked --no-roster
      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Run voiceprint tests
        run: python -B -m pytest -q -p no:cacheprovider -rs scripts/voiceprint/tests
      - name: Run benchmark harness tests
        env:
          PYANNOTE_METRICS_ENABLED: '0'
        run: python -B -m pytest -q -p no:cacheprovider -rs bench/tests
